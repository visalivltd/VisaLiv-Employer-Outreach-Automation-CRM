[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshika Arya", email = "automation@visaliv.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "apscheduler>=3.11.3",
    "bcrypt==4.1.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

# [project.scripts]
# backend = "backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
